<svg viewBox="0 0 1160 600" width="1160" height="600" xmlns="http://www.w3.org/2000/svg">
<style>
.comp { fill: #ffffff; stroke: #18211e; stroke-width: 1.5; }
.board { fill: #e3eee8; stroke: #4f7a65; stroke-width: 1.5; }
.shield { fill: #e6ebf3; stroke: #5a6f93; stroke-width: 1.5; }
.hdr { fill: #ffffff; stroke: #5a6f93; stroke-width: 1.2; }
.bb { fill: none; stroke: #d3dcd8; stroke-width: 1.5; stroke-dasharray: 6 5; }
.t-title { fill: #18211e; font: 600 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
.t-pin { fill: #18211e; font: 500 11.5px ui-monospace, "SFMono-Regular", Menlo, monospace; }
.t-dim { fill: #5b6863; font: 400 11px ui-monospace, "SFMono-Regular", Menlo, monospace; }
.t-note { fill: #5b6863; font: 400 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
.t-warn { fill: #d23a2c; font: 500 11px system-ui, -apple-system, "Segoe UI", sans-serif; }
.w { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.w-pow { stroke-width: 4; }
.w-sig { stroke-width: 2.5; }
.w-usb { stroke: #7c8a85; stroke-width: 6; }
.c-5v { stroke: #d23a2c; }
.c-gnd { stroke: #222a27; }
.c-3v3 { stroke: #e08a12; }
.c-sda { stroke: #2f6fd0; }
.c-scl { stroke: #23935a; }
.c-sig { stroke: #ef8f1c; }
.c-brn { stroke: #7a4a2a; }
.dot-5v { fill: #d23a2c; }
.dot-gnd { fill: #222a27; }
.pin { fill: #18211e; }
.pin-dim { fill: #5b6863; }
.pin-nc { fill: #ffffff; stroke: #18211e; stroke-width: 1.5; }
.x-mark { stroke: #d23a2c; stroke-width: 2; stroke-linecap: round; }
.cap { fill: none; stroke: #18211e; stroke-width: 2; }
.cap-opt { fill: none; stroke: #5b6863; stroke-width: 2; stroke-dasharray: 3 3; }

</style>
<rect width="1160" height="600" fill="#ffffff"/>
        <!-- Supply -->
        <rect class="comp" x="30" y="40" width="170" height="100" rx="4"/>
        <text class="t-title" x="46" y="66">Power supply</text>
        <text class="t-note" x="46" y="84">5 V · 3 A</text>
        <text class="t-pin" x="188" y="74" text-anchor="end">+5V</text>
        <text class="t-pin" x="188" y="114" text-anchor="end">GND</text>
        <line class="w w-pow c-5v" x1="200" y1="70" x2="620" y2="70"/>
        <line class="w w-pow c-gnd" x1="200" y1="110" x2="620" y2="110"/>
        <text class="t-note" x="380" y="62" text-anchor="middle">18–20 AWG, short</text>

        <!-- PCA9685 board, logic header shown V+ at top to GND at bottom -->
        <rect class="board" x="560" y="40" width="580" height="300" rx="6"/>
        <text class="t-title" x="1124" y="64" text-anchor="end">PCA9685 servo driver</text>
        <text class="t-note" x="1124" y="82" text-anchor="end">16 channels, I²C address 0x40</text>
        <text class="t-pin" x="570" y="64">V+</text>
        <text class="t-pin" x="570" y="128">GND</text>
        <text class="t-note" x="570" y="146">screw terminal</text>
        <path class="cap" d="M600 70 V85 M588 85 H612 M600 110 V95"/>
        <path class="cap" d="M588 97 Q600 91 612 97"/>
        <text class="t-pin" x="592" y="82" text-anchor="end">+</text>
        <text class="t-pin" x="630" y="88">C2</text>
        <text class="t-note" x="630" y="104">470–1000 µF, ≥10 V</text>
        <circle class="pin-nc" cx="560" cy="166" r="3.5"/>
